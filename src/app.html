<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script>
			// Apply the saved (or system) theme and reader settings before first
			// paint to avoid flashing. Keep in sync with src/lib/state/*.svelte.ts.
			(function () {
				var root = document.documentElement;
				try {
					var saved = localStorage.getItem('c3-course:theme');
					var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
					if (dark) root.classList.add('dark');
				} catch (e) {}
				try {
					var settings = JSON.parse(localStorage.getItem('c3-course:settings') || '{}');
					if (settings.font === 'sans') root.dataset.font = 'sans';
					if (settings.textSize === 125 || settings.textSize === 150) {
						root.dataset.textSize = String(settings.textSize);
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
